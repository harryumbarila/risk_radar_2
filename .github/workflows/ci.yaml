name: DENALI CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  container-job:
    name: DENALI CI
    runs-on: ubuntu-latest
    container: node:22.14.0-slim

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: yarn install

      - name: Run lint
        run: yarn run lint

      - name: Run tests unit
        run: yarn run test:unit

      - name: Run tests e2e
        run: yarn run test:e2e

      - name: Run API build
        run: yarn turbo run build --filter=@denali/api

      - name: Set Frontegg environment variables
        run: echo "FRONTEGG_APP_URL=http://localhost:3000" >> $GITHUB_ENV && \
          echo "FRONTEGG_BASE_URL=https://app-nypv37bm638g.frontegg.com" >> $GITHUB_ENV && \
          echo "FRONTEGG_CLIENT_ID=XXX" >> $GITHUB_ENV && \
          echo "FRONTEGG_APP_ID=XXX" >> $GITHUB_ENV && \
          echo "FRONTEGG_ENCRYPTION_PASSWORD=XXX" >> $GITHUB_ENV && \
          echo "FRONTEGG_COOKIE_NAME=fe_session" >> $GITHUB_ENV && \
          echo "FRONTEGG_HOSTED_LOGIN=true" >> $GITHUB_ENV && \
          echo "FRONTEGG_LOG_LEVEL=debug" >> $GITHUB_ENV

      - name: Run WEB build
        run: yarn turbo run build --filter=@denali/web