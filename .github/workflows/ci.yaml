name: Stanley CI

permissions:
  contents: write
  id-token: write
  packages: read

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-job:
    name: CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          SA_PASSWORD: Stanley123!
          POSTGRES_DB: test
          MSSQL_PID: Express
          MSSQL_AGENT_ENABLED: true
          MSSQL_TCP_PORT: 1433
        ports:
          - 1433:1433
      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install commitlint
        if: github.event_name == 'pull_request'
        run: npm install -g @commitlint/cli @commitlint/config-conventional

      - name: Run commitlint
        if: github.event_name == 'pull_request'
        run: commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Searching for secrets using trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

      - name: Install Semgrep
        if: (github.actor != 'dependabot[bot]')
        run: python3 -m pip install semgrep

      - name: Add semgrep token to publish results in SAST platform
        if: (github.actor != 'dependabot[bot]')
        run: |-
          mkdir -p ~/.config/.semgrep
          echo "api_token: ${{ secrets.SEMGREP_APP_TOKEN }}" > ~/.config/.semgrep/settings.yml

      - name: Semgrep ci
        if: (github.actor != 'dependabot[bot]')
        run: semgrep ci

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ls-lint
        run: yarn ls-lint

      - name: Run Checks
        env:
          FINANCE_DB_URL: mssql://sa:Stanley123!@localhost:1433/master?encrypt=false&trustServerCertificate=true
          IRIS_DB_URL: mssql://sa:Stanley123!@localhost:1433/master?encrypt=false&trustServerCertificate=true
          REDIS_QUEUE_HOST: localhost
          REDIS_QUEUE_PORT: 6379

        run: |
          yarn run lint type-check
          yarn test:unit
          # yarn test:e2e

      - name: Run build
        run: yarn build
