  restart-staging:
    runs-on: ubuntu-latest
    # needs: [deploy-web, deploy-api]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Debug OIDC Claims
        uses: github/actions-oidc-debugger@main
        with:
          audience: 'sts.amazonaws.com'

      - name: Show Token Claims
        run: |
          echo "${{ steps.oidc.outputs.token }}"

      - name: Dump OIDC Token Claims (Before AWS Auth)
        run: |
          echo "Fetching OIDC Token Data..."
          curl -sSL "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
          -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq '.'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # TODO: We might need to move this to GH Actions secrets
          role-to-assume: arn:aws:iam::257498453293:role/jobox-github-action-staging-denali
          aws-region: us-west-2

      - name: Debug OIDC Token
        run: |
          echo "Fetching OIDC Token Data..."
          cat $AWS_WEB_IDENTITY_TOKEN_FILE | jq -R 'split(".") | .[1] | @base64d | fromjson' | tee token.json
          echo "Extracted Claims:"
          cat token.json | jq '.'

      - name: Restart Staging API
        run: |
          aws ssm send-command --document-name "AWS-RunShellScript" --document-version "1" --targets '[{"Key":"InstanceIds","Values":["i-022feced8398583f3"]}]' --parameters '{"commands":["runuser -l ec2-user -c /opt/webapps/scripts/pull_and_restart_api.sh"],"workingDirectory":[""],"executionTimeout":["3600"]}' --timeout-seconds 600 --max-concurrency "50" --max-errors "0" --cloud-watch-output-config '{"CloudWatchLogGroupName":"stg-denali-api-deployment","CloudWatchOutputEnabled":true}' --region us-west-2
