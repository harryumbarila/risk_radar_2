name: Check for dependency vulnerabilities

on:
  schedule:
    - cron: '0 0 * * 1'
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  dependencies-and-secrets:
    name: dependencycheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install Semgrep
        if: (github.actor != 'dependabot[bot]')
        run: python3 -m pip install semgrep

      - name: Add semgrep token to publish results in SAST platform
        if: (github.actor != 'dependabot[bot]')
        run: |-
          mkdir -p ~/.config/.semgrep
          echo "api_token: ${{ secrets.SEMGREP_APP_TOKEN }}" > ~/.config/.semgrep/settings.yml

      - name: Semgrep ci
        if: (github.actor != 'dependabot[bot]')
        run: semgrep ci --supply-chain

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run npm audit
        run: |
          # Run audit with JSON output to parse results
          AUDIT_JSON=$(yarn audit --level high --recursive --json 2>/dev/null || echo "")

          # Extract vulnerability counts from JSON
          HIGH_COUNT=$(echo "$AUDIT_JSON" | grep '"high"' | wc -l || echo "0")
          CRITICAL_COUNT=$(echo "$AUDIT_JSON" | grep '"critical"' | wc -l || echo "0")

          # Show audit results
          yarn audit --level high --recursive

          # Fail only if there are high or critical vulnerabilities
          if [ "$HIGH_COUNT" -gt 0 ] || [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ Found $HIGH_COUNT high and $CRITICAL_COUNT critical vulnerabilities!"
            exit 1
          else
            echo "✅ No high or critical vulnerabilities found."
            exit 0
          fi
