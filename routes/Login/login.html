                    <p class='col-12 welcome-text'>Welcome back!</p>
                    <p class='col-12 details-text'>ENTER YOUR DETAILS BELOW</p>
                </div>
                <div class='login-form row'>
                    <form class='form-main col-12 offset-md-4 col-md-4 offset-xl-3 col-xl-6 text-center'>
                        <div class='form-group transparent-input'>
                            <label htmlFor='input-email credentials-group'>Email Address</label>
                            <input name='email'
                                   type='email'
                                   class='form-control'
                                   id='input-email'
                                   aria-describedby='emailHelp'
                            />
                        </div>
                        <div class='form-group'>
                            <label htmlFor='input-password credentials-group'>Password</label>
                            <input name='password' type='password' class='form-control' id='input-password'/>
                        </div>
                        <div class='form-check remember-text'>
                            <input class='form-check-input' type='checkbox' value='' />
                            <label class='form-check-label'>
                                REMEMBER ME NEXT TIME
                            </label>
                        </div>
                        <button type='submit' class='col-12 col-lg-3 col-lg-6 btn-lg round'>LOGIN</button>
                    </form>
                </div>
            </div>
